server:
  port: 8080

spring:
  application:
    name: orders
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${SPRING_DATASOURCE_USERNAME:orders}
    password: ${SPRING_DATASOURCE_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    # Same JSON style as the Go and Python services: restaurant_id, dish_id, courier_id.
    property-naming-strategy: SNAKE_CASE
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

restaurants:
  url: ${RESTAURANTS_URL:http://localhost:8003}
payments:
  url: ${PAYMENTS_URL:http://localhost:8002}
delivery:
  url: ${DELIVERY_URL:http://localhost:8004}

management:
  endpoints:
    web:
      exposure:
        include: health,info
