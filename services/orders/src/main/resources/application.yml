server:
  port: 8080

spring:
  application:
    name: orders
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${SPRING_DATASOURCE_USERNAME:orders}
    password: ${SPRING_DATASOURCE_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

inventory:
  url: ${INVENTORY_URL:http://localhost:8003}

management:
  endpoints:
    web:
      exposure:
        include: health,info
