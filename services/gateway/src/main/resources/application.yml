server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: orders
          uri: ${ORDERS_URL:http://localhost:8081}
          predicates:
            - Path=/api/orders/**,/api/orders
          filters:
            - StripPrefix=1
        - id: payments
          uri: ${PAYMENTS_URL:http://localhost:8002}
          predicates:
            - Path=/api/payments/**,/api/payments
          filters:
            - StripPrefix=1
        - id: inventory
          uri: ${INVENTORY_URL:http://localhost:8003}
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1
        - id: notifications
          uri: ${NOTIFICATION_URL:http://localhost:8004}
          predicates:
            - Path=/api/notifications/**,/api/notifications
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
