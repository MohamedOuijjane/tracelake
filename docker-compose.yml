# tracelake local stack.
# Profiles:
#   core  Kafka, MinIO, Spark                                  (about 6 GB)
#   full  core + collector, services, Postgres, Airflow, Trino, Grafana
#   demo  full + k6 load generator
# Usage: make up | make up-full | make demo
#
# One-shot init jobs (kafka-init, minio-init, airflow-init) exit when done.
# Dependents wait for them with condition: service_completed_successfully.

name: tracelake

x-core-profiles: &core-profiles [core, full, demo]
x-full-profiles: &full-profiles [full, demo]

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local

x-spark-env: &spark-env
  SPARK_NO_DAEMONIZE: "true"
  PYTHONPATH: /opt/tracelake/spark
  PYSPARK_PYTHON: python3
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  S3_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  profiles: *full-profiles
  user: "50000:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  networks: [tracelake]

services:
  # ---------------------------------------------------------------- core
  kafka:
    image: apache/kafka:3.9.1
    profiles: *core-profiles
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka:/opt/tracelake/kafka:ro
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536m
    networks: [tracelake]

  kafka-init:
    image: apache/kafka:3.9.1
    profiles: *core-profiles
    entrypoint: ["bash", "/opt/tracelake/kafka/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./kafka:/opt/tracelake/kafka:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [tracelake]

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: *core-profiles
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [tracelake]

  minio-init:
    image: pgsty/mc:RELEASE.2026-08-04T00-00-00Z
    profiles: *core-profiles
    entrypoint: ["/bin/sh", "/opt/tracelake/minio/init.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./lakehouse/minio:/opt/tracelake/minio:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [tracelake]

  spark-master:
    image: apache/spark:3.5.5-scala2.12-java17-python3-ubuntu
    profiles: *core-profiles
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      <<: *spark-env
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark:/opt/tracelake/spark:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536m
    networks: [tracelake]

  spark-worker:
    image: apache/spark:3.5.5-scala2.12-java17-python3-ubuntu
    profiles: *core-profiles
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
      SPARK_DAEMON_MEMORY: 256m
    ports:
      - "8083:8081"
    volumes:
      - ./spark:/opt/tracelake/spark:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      spark-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2560m
    networks: [tracelake]

  # ---------------------------------------------------------------- full: telemetry
  otel-collector:
    build: ./otel
    image: tracelake/otel-collector:0.120.0
    profiles: *full-profiles
    ports:
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384m
    networks: [tracelake]

  # ---------------------------------------------------------------- full: services
  postgres:
    image: postgres:16.4-alpine
    profiles: *full-profiles
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME}
      POSTGRES_USER: ${ORDERS_DB_USER}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD}
    volumes:
      - orders-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [tracelake]

  inventory:
    build: ./services/inventory
    image: tracelake/inventory:0.1.0
    profiles: *full-profiles
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: inventory
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [tracelake]

  notification:
    build: ./services/notification
    image: tracelake/notification:0.1.0
    profiles: *full-profiles
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: notification
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [tracelake]

  payments:
    build: ./services/payments
    image: tracelake/payments:0.1.0
    profiles: *full-profiles
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: payments
      NOTIFICATION_URL: http://notification:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      otel-collector:
        condition: service_healthy
      notification:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [tracelake]

  orders:
    build: ./services/orders
    image: tracelake/orders:0.1.0
    profiles: *full-profiles
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: orders
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ORDERS_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${ORDERS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDERS_DB_PASSWORD}
      INVENTORY_URL: http://inventory:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      inventory:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [tracelake]

  gateway:
    build: ./services/gateway
    image: tracelake/gateway:0.1.0
    profiles: *full-profiles
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: gateway
      ORDERS_URL: http://orders:8080
      PAYMENTS_URL: http://payments:8000
      INVENTORY_URL: http://inventory:8080
      NOTIFICATION_URL: http://notification:8000
    ports:
      - "8000:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      orders:
        condition: service_healthy
      payments:
        condition: service_healthy
      inventory:
        condition: service_healthy
      notification:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [tracelake]

  # ---------------------------------------------------------------- full: orchestration
  airflow-postgres:
    image: postgres:16.4-alpine
    profiles: *full-profiles
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [tracelake]

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin --firstname Admin --lastname User \
          --email admin@example.com \
          --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" || true
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 768m

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1536m

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g

  # ---------------------------------------------------------------- full: query and dashboards
  trino:
    image: trinodb/trino:470
    profiles: *full-profiles
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8082:8080"
    volumes:
      - ./lakehouse/trino/catalog/hudi.properties:/etc/trino/catalog/hudi.properties:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [tracelake]

  grafana:
    image: grafana/grafana:11.5.2
    profiles: *full-profiles
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: trino-datasource 1.0.11
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      trino:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m
    networks: [tracelake]

  # ---------------------------------------------------------------- demo
  k6:
    image: grafana/k6:0.57.0
    profiles: [demo]
    command: ["run", "/scripts/scenarios.js"]
    environment:
      BASE_URL: http://gateway:8080
      K6_VUS: ${K6_VUS}
      K6_DURATION: ${K6_DURATION}
    volumes:
      - ./loadgen/k6:/scripts:ro
    healthcheck:
      # k6 is a batch process with no HTTP port: check that the binary runs.
      test: ["CMD", "k6", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      gateway:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [tracelake]

networks:
  tracelake:
    name: tracelake

volumes:
  kafka-data:
  minio-data:
  orders-db:
  airflow-db:
  airflow-logs:
  grafana-data:
