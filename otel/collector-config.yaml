# OTel Collector: receive OTLP from services, batch, export to Kafka as OTLP JSON.
# One exporter per signal so each lands in its own topic.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  kafka/traces:
    brokers: [kafka:9092]
    protocol_version: 2.1.0
    topic: otel.traces
    encoding: otlp_json
    producer:
      compression: lz4
  kafka/metrics:
    brokers: [kafka:9092]
    protocol_version: 2.1.0
    topic: otel.metrics
    encoding: otlp_json
    producer:
      compression: lz4
  kafka/logs:
    brokers: [kafka:9092]
    protocol_version: 2.1.0
    topic: otel.logs
    encoding: otlp_json
    producer:
      compression: lz4

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka/logs]
