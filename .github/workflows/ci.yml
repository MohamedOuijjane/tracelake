name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.9.6
      - run: ruff check .
      - run: ruff format --check .

  spark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spark/requirements.txt
      - run: pip install -r spark/requirements.txt
      - run: pytest -q
        working-directory: spark

  airflow-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >
          pip install -r airflow/requirements.txt
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt
      - run: |
          export AIRFLOW_HOME="$RUNNER_TEMP/airflow"
          airflow db migrate > /dev/null
          pytest -q airflow/tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - name: validate each profile
        run: |
          for p in core full demo; do
            echo "profile: $p"
            docker compose --profile "$p" config -q
          done
      - name: validate collector config
        run: >
          docker run --rm -v "$PWD/otel:/cfg"
          otel/opentelemetry-collector-contrib:0.120.0
          validate --config=/cfg/collector-config.yaml

  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context:
          - services/gateway
          - services/orders
          - services/payments
          - services/inventory
          - services/notification
          - otel
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
