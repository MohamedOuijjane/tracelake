# Trino Hudi catalog over MinIO.
# Uses the file metastore stored in the gold bucket until a Hive Metastore is added (see ADR 0003).
connector.name=hudi
hive.metastore=file
hive.metastore.catalog.dir=s3://gold/_metastore

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
